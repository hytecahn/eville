name: EzVille monitor tests
on:
  pull_request:
    paths: ['ezville_monitor/**', 'monitoring/**', '.github/workflows/ezville-monitor.yml']
  push:
    branches: [master]
    paths: ['ezville_monitor/**', 'monitoring/**', '.github/workflows/ezville-monitor.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s monitoring/tests -v
      - run: docker build -t ezville-monitor-test ezville_monitor
      - name: Run monitor tests in the built image
        run: >-
          docker run --rm --network none --entrypoint python
          -v "$PWD/monitoring/tests:/repo/monitoring/tests:ro"
          ezville-monitor-test -m unittest discover -s /repo/monitoring/tests -v
